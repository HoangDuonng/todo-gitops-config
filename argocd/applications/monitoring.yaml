apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: kube-prometheus-stack
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 62.6.0
    helm:
      values: |
        #--------------------------------------------------------------
        # Grafana
        #--------------------------------------------------------------
        grafana:
          nodeSelector:
            workload: infrastructure
          service:
            type: ClusterIP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi

          # Enable sidecar so dashboards & datasources are auto-provisioned
          sidecar:
            datasources:
              enabled: true
              defaultDatasourceEnabled: true
            dashboards:
              enabled: true
              searchNamespace: monitoring

          # Explicit datasources (Loki is not auto-discovered)
          additionalDataSources:
            - name: Loki
              type: loki
              access: proxy
              url: http://loki-logging.monitoring:3100
              isDefault: false
              jsonData:
                maxLines: 1000

          persistence:
            enabled: true
            size: 2Gi
            storageClassName: local-path

        #--------------------------------------------------------------
        # Prometheus
        #--------------------------------------------------------------
        prometheus:
          prometheusSpec:
            nodeSelector:
              workload: infrastructure
            retention: 15d
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                cpu: 1
                memory: 2Gi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 10Gi

        #--------------------------------------------------------------
        # Alertmanager
        #--------------------------------------------------------------
        alertmanager:
          alertmanagerSpec:
            nodeSelector:
              workload: infrastructure
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 100m
                memory: 128Mi

        #--------------------------------------------------------------
        # Prometheus Operator
        #--------------------------------------------------------------
        prometheusOperator:
          nodeSelector:
            workload: infrastructure
          admissionWebhooks:
            enabled: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi

        #--------------------------------------------------------------
        # Node Exporter  (DaemonSet – runs on every node)
        # hostNetwork: false → avoids kube-proxy port conflict.
        # endpoints: overrides Helm template bug that generates 
        #   two conflicting --web.listen-address arguments.
        #--------------------------------------------------------------
        prometheus-node-exporter:
          hostNetwork: false
          hostPID: true
          endpoints:
            - 0.0.0.0:9100
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

        #--------------------------------------------------------------
        # Kube State Metrics
        #--------------------------------------------------------------
        kube-state-metrics:
          nodeSelector:
            workload: infrastructure
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi

  destination:
    server: "https://kubernetes.default.svc"
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
