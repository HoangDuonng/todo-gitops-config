apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: kube-prometheus-stack
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 62.6.0
    helm:
      values: |
        grafana:
          nodeSelector:
            workload: infrastructure
          service:
            type: ClusterIP
          grafana.ini:
            server:
              domain: localhost
              root_url: "%(protocol)s://%(domain)s:%(port)s/grafana/"
              serve_from_sub_path: true
          ingress:
            enabled: true
            ingressClassName: nginx
            path: /grafana
          resources:
            requests:
              cpu: 20m
              memory: 100Mi
            limits:
              cpu: 100m
              memory: 200Mi
          sidecar:
            datasources:
              enabled: false
          datasources:
            datasources.yaml:
              apiVersion: 1
              datasources:
                - name: Prometheus
                  type: prometheus
                  access: proxy
                  url: http://prometheus-monitoring-kube-prometheus.monitoring:9090
                  isDefault: true
                  jsonData:
                    httpMethod: POST
                    timeInterval: 30s
                - name: Loki
                  type: loki
                  access: proxy
                  url: http://loki-logging:3100
                  isDefault: false
                  jsonData:
                    maxLines: 1000
        prometheus:
          prometheusSpec:
            nodeSelector:
              workload: infrastructure
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 500m
                memory: 1Gi
        alertmanager:
          alertmanagerSpec:
            resources:
              requests:
                cpu: 50m
                memory: 100Mi
              limits:
                cpu: 100m
                memory: 200Mi
        prometheusOperator:
          admissionWebhooks:
            enabled: true
          resources:
            requests:
              cpu: 20m
              memory: 100Mi
            limits:
              cpu: 100m
              memory: 200Mi
        prometheus-node-exporter:
          extraArgs:
            - --web.listen-address=0.0.0.0:9100
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
            limits:
              cpu: 50m
              memory: 50Mi
        kube-state-metrics:
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
            limits:
              cpu: 50m
              memory: 50Mi
  destination:
    server: "https://kubernetes.default.svc"
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
